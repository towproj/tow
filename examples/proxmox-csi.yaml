# Volumes as Proxmox disks (the Proxmox CSI plugin), on three new Proxmox VE VMs running k3s
# (a control plane and two workers, so a volume can move from one worker to the other):
# a volume is a disk on the file's storage (local-lvm by default), attached to the VM its pod
# runs on, and moved with it. The plugin needs:
#   - its own token in PROXMOX_CSI_TOKEN (id=secret), with only its role (docs/storage.md),
#     never your admin token;
#   - Proxmox in a cluster: one server can be a cluster of its own (pvecm create <name>).
# 'tow delete' won't delete a cluster that has such volumes unless you pass -v, which
# deletes them with it. The addresses match the test lab in docs/testing/proxmox.md.
# Remove everything with: tow delete --name csi-pve -v
apiVersion: towproj.github.io/v1alpha1
kind: Cluster
metadata:
  name: csi-pve
spec:
  kubernetes:
    distribution: k3s
    networking:
      cni: flannel
    storage:
      csi: [proxmox]
  infrastructure:
    provider: proxmox
    proxmox:
      url: https://192.168.100.10:8006
      node: pve
      template: 9000
    network:
      subnet: 192.168.100.0/24
      addresses: 192.168.100.20-192.168.100.29
      gateway: 192.168.100.1
      dns: [1.1.1.1]
  workers:
    - count: 2
