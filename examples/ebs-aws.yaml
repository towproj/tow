# EBS volumes (the AWS EBS CSI driver) and Traefik on the nodes' ports, on two AWS t3.small
# (kubeadm, flannel). The driver's AWS permissions come from an IAM role tow puts on the
# control plane (AWS's own policy for it; no keys anywhere); its volumes are gp3, encrypted,
# tagged with the cluster. With no service load balancer, Traefik listens on every node's
# ports 80 and 443, open to your address; access.ports opens more (here 8080) for what you
# install yourself. 'tow delete' won't delete a cluster that has EBS volumes unless you
# pass -v, which deletes them with it. Remove everything with: tow delete --name ebs-aws -v
apiVersion: towproj.github.io/v1alpha1
kind: Cluster
metadata:
  name: ebs-aws
spec:
  kubernetes:
    distribution: kubeadm
    networking:
      cni: flannel
    storage:
      csi: [aws-ebs]
    ingress:
      controllers: [traefik]
  infrastructure:
    provider: aws
    aws: {region: eu-west-3}
    access:
      ports: [8080]
  controlPlane:
    instanceType: t3.small
  workers:
    - name: general
      count: 1
      instanceType: t3.small
