# Every storage driver tow installs, on three AWS t3.small servers (one control plane, two
# workers): local-path (the default class), OpenEBS LocalPV hostpath, Longhorn with two
# copies of each volume, NFS and SMB. Plus metrics-server and a manifest. Upstream Kubernetes
# with kubeadm and flannel.
#
# The NFS and SMB addresses below are in-cluster test servers that 'make test-aws' starts
# itself; put your file server's address and share here. The SMB credentials come from the
# variables named below, never from this file. AWS credentials come from your usual AWS
# login. Remove everything with: tow delete --name storage-aws
apiVersion: towproj.github.io/v1alpha1
kind: Cluster
metadata:
  name: storage-aws
spec:
  kubernetes:
    distribution: kubeadm
    networking:
      cni: flannel
    storage:
      csi: [local-path, openebs, longhorn, nfs, smb]
      defaultClass: local-path
      longhorn: {replicas: 2}        # two workers: two copies of each volume
      nfs:
        server: nfs-server.storage-test.svc.cluster.local
        path: /
      smb:
        source: //smb-server.storage-test.svc.cluster.local/share
        usernameEnv: SMB_USER
        passwordEnv: SMB_PASSWORD
    metricsServer: {enabled: true}
    addons:
      manifests: [manifests/demo.yaml]   # its objects go into namespace "demo"
  infrastructure:
    provider: aws
    aws: {region: eu-west-3}
  controlPlane:
    instanceType: t3.small
  workers:
    - name: general
      count: 2
      instanceType: t3.small
