# kubeadm on two GCP e2-medium machines running AlmaLinux 10 (AlmaLinux's own images, in the
# almalinux-cloud project: free). Google's guest agent creates the login user (almalinux) from
# the SSH key; tow prepares the machines with dnf, sets SELinux to permissive as kubeadm's
# install page does, and installs kubelet, kubeadm and kubectl from pkgs.k8s.io's rpm
# repository. 4 GB is enough for the control plane despite the memory AlmaLinux keeps for
# kdump (a 2 GB e2-small isn't). About $0.08/hour while it runs; remove it with:
# tow delete --name dev-gcp-alma
apiVersion: towproj.github.io/v1alpha1
kind: Cluster
metadata:
  name: dev-gcp-alma
spec:
  flavor: dev-test                   # optional preset: kubeadm + calico, local-path, traefik, metrics-server; 1 control plane + 1 worker
  infrastructure:
    provider: gcp
    os: almalinux-10
    gcp: {project: my-project-123456, region: europe-west1}
  workers:
    - name: general
      count: 1
