name: CI
on: [push, pull_request]

# CI only reads the repository.
permissions:
  contents: read

# A new push stops the run still going for the same branch or pull request; main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26' }
      
      # A pinned release, checked against its sha256 (k3d's checksums.txt), not an install
      # script from k3d's main branch.
      - name: Install k3d
        env:
          K3D_VERSION: 5.9.0
          K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
        run: |
          curl -sSfL -o k3d "https://github.com/k3d-io/k3d/releases/download/v${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  k3d" | sha256sum -c -
          sudo install k3d /usr/local/bin/k3d && rm k3d && k3d version
      
      # With the race detector: tow works on several machines at once. The runner has a
      # C compiler (cgo) and the memory the AWS SDK's packages need under -race.
      - name: Unit tests
        run: go test -race -v -short ./internal/... ./cmd/...
      
      - name: Integration tests
        run: go test -v ./integration/... -timeout 10m
        env: { INTEGRATION: "1" }
      
      - name: Cleanup orphaned clusters
        if: always()
        run: |
          for cluster in $(k3d cluster list -o json | jq -r '.[].name' | grep '^test-'); do
            k3d cluster delete "$cluster" || true
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # scan the whole history, not just the pushed commit

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan for secrets
        run: ./gitleaks git --redact --verbose .

  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_version: 1.13.9, tofu_wrapper: false }

      # Offline checks only: no cloud credentials exist in CI.
      - name: Validate cloud modules
        run: |
          for m in internal/providers/tofu/*/module/; do
            tofu -chdir="$m" fmt -check -diff
            tofu -chdir="$m" init -backend=false -input=false
            tofu -chdir="$m" validate
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26' }
      - run: go build -o tow
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then echo "Not formatted with gofmt:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...

  # golangci-lint with .golangci.yml: staticcheck, gosec, errcheck, unused and more.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26' }
      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: 2.15.0
          GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
        run: |
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          curl -sSfL -o lint.tar.gz "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/${archive}.tar.gz"
          echo "${GOLANGCI_LINT_SHA256}  lint.tar.gz" | sha256sum -c -
          tar -xzf lint.tar.gz --strip-components=1 "${archive}/golangci-lint"
      - name: Lint
        run: ./golangci-lint run ./...