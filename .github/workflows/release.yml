name: Release
# On a pull request: every platform and package built as a snapshot (nothing signed or
# published), the packages installed on Ubuntu, Debian, Rocky Linux and AlmaLinux, and
# tow built and unit-tested on macOS. On a v* tag: the real release, once the
# repository is public (signatures and provenance name it in public logs).
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops its previous run; a release is never stopped.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GORELEASER_VERSION: v2.20.2

jobs:
  snapshot:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26' }
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # The repositories get a key that lives for this run only; the real one signs releases.
      - name: A throwaway signing key
        run: |
          gpg --batch --passphrase '' --quick-gen-key 'tow CI (throwaway) <ci@invalid>' rsa3072 sign 1d
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          gpg --armor --export-secret-keys "$key" > "$RUNNER_TEMP/signing.asc"
          echo "GPG_KEY_ID=$key" >> "$GITHUB_ENV"
          echo "RPM_SIGNING_KEY_FILE=$RUNNER_TEMP/signing.asc" >> "$GITHUB_ENV"
      # A snapshot signs the .rpm files but runs no cosign (.goreleaser.yaml).
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean
      # The cask as a release would push it: valid Ruby, and the quarantine step in Homebrew's
      # step syntax (v0.1.0's hand-checked cask failed on both).
      - name: The Homebrew cask
        run: |
          cask=dist/homebrew/Casks/tow.rb
          ruby -c "$cask"
          grep -q '^  postflight_steps do$' "$cask"
          grep -qF '"{{staged_path}}/tow"' "$cask"
      - name: The apt and yum repositories
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils createrepo-c
          scripts/package-repos.sh dist site file:///site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 7

  packages:
    needs: snapshot
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "rockylinux/rockylinux:9", "almalinux:10"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: site, path: site }
      # Added the way a user adds them; apt and dnf check every signature.
      - name: Install tow from the repositories
        run: scripts/test-package-repos.sh site

  macos:
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26' }
      - name: Build
        run: go build -o tow . && ./tow version
      - name: Unit tests
        run: go test -short ./internal/... ./cmd/...

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: write      # the GitHub release
      id-token: write      # cosign keyless signing
      attestations: write  # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26' }
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: The packages' signing key
        env: { KEY: "${{ secrets.PACKAGES_SIGNING_KEY }}" }
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/signing.asc"
          echo "RPM_SIGNING_KEY_FILE=$RUNNER_TEMP/signing.asc" >> "$GITHUB_ENV"
      # A token from the project's GitHub App: homebrew-tap only, contents only, valid one
      # hour, revoked when the job ends.
      - id: tap
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: towproj
          repositories: homebrew-tap
          permission-contents: write
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.asc"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt

  # The site again, with the apt and yum repositories now holding this release (pages.yml:
  # rebuilt from the last five releases, nothing kept in git). A release made with the
  # workflow's own token starts no other workflow, so it's called from here.
  pages:
    needs: release
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
