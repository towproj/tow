# OpenSSF Scorecard: checks the repository's security practices on every push to main and
# weekly, and publishes the results (api.scorecard.dev, the badge, and the code-scanning tab).
# Runs only in the public towproj/tow. Scorecard refuses to publish results from a workflow with
# workflow-level env, defaults or write permissions, so the job keeps its permissions to itself.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    # Scheduled runs carry no repository in their event, hence the name check (forks too).
    if: ${{ github.repository == 'towproj/tow' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write # the results go to the code-scanning tab
      id-token: write        # publishing proves which workflow produced the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
