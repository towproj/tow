# Monthly update pull requests: one for the Go modules, one for the GitHub Actions, every
# update grouped in it, major versions included. Security updates still come right away.
# The OpenTofu providers and the website's npm packages stay pinned by hand: CI can't prove
# a provider bump without real clouds.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
