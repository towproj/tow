{{- /*
  Each page of ../docs starts with its title as a heading, for GitHub; the site shows the
  title from the front matter already, so that first heading is left out here.
*/ -}}
{{- if ne .Level 1 -}}
<h{{ .Level }} id="{{ .Anchor }}">{{ .Text | safeHTML }}<a class="td-heading-self-link" href="#{{ .Anchor }}" aria-label="Heading self-link"></a></h{{ .Level }}>
{{- end -}}
