# Codecov: unit-test coverage from CI (ci.yml, test job). The integration tests build real
# clusters and aren't measured here.
coverage:
  status:
    # Reported on each pull request, without blocking it: a dip shows, it doesn't stop a merge.
    project:
      default:
        target: auto   # compared with the base branch
        threshold: 1%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, files"
  require_changes: false
